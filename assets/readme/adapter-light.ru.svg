<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
<title id="title">Каждый адаптер — три файла, и I/O только в одном</title>
<desc id="desc">client.py (у Ozon browser.py) знает эндпоинты и единственный делает I/O; он передаёт декодированный dict в parse.py — чистые функции без импорта клиента, которые возвращают Raw-модели; source.py связывает их в ProductSource для вашего кода. Парсеры тестируются на сохранённых ответах без сети и без моков.</desc>
<rect width="1200" height="300" rx="20" fill="#F2F5F7"/>
<text x="48" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', sans-serif" font-size="26" fill="#14202B" font-weight="700" xml:space="preserve">Каждый адаптер — три файла, и I/O только в одном</text>
<rect x="48" y="96" width="320" height="118" rx="12" fill="#FFFFFF" stroke="#A8730B" stroke-width="2"/>
<text x="70" y="138" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="24" fill="#A8730B" font-weight="700" xml:space="preserve">client.py</text>
<text x="70" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', sans-serif" font-size="20" fill="#14202B" xml:space="preserve">эндпоинты, HTTP/браузер</text>
<text x="70" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', sans-serif" font-size="19" fill="#56636E" xml:space="preserve">единственный с I/O</text>
<rect x="440" y="96" width="320" height="118" rx="12" fill="#FFFFFF" stroke="#D5DDE3" stroke-width="2"/>
<text x="462" y="138" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="24" fill="#0A6A94" font-weight="700" xml:space="preserve">parse.py</text>
<text x="462" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', sans-serif" font-size="20" fill="#14202B" xml:space="preserve">чистые функции над dict</text>
<text x="462" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', sans-serif" font-size="19" fill="#56636E" xml:space="preserve">тесты на сохранённых ответах</text>
<rect x="832" y="96" width="320" height="118" rx="12" fill="#FFFFFF" stroke="#D5DDE3" stroke-width="2"/>
<text x="854" y="138" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="24" fill="#0A6A94" font-weight="700" xml:space="preserve">source.py</text>
<text x="854" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', sans-serif" font-size="20" fill="#14202B" xml:space="preserve">связывает оба файла</text>
<text x="854" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', sans-serif" font-size="19" fill="#56636E" xml:space="preserve">реализует ProductSource</text>
<path d="M378 155 H430 M420 147 L430 155 L420 163" stroke="#56636E" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="404" y="140" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="18" fill="#56636E" text-anchor="middle" xml:space="preserve">dict</text>
<path d="M770 155 H822 M812 147 L822 155 L812 163" stroke="#56636E" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="796" y="140" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="18" fill="#56636E" text-anchor="middle" xml:space="preserve">Raw*</text>
<path d="M470 214 V244 H730 V214" stroke="#1F7A4D" stroke-width="2" fill="none" stroke-dasharray="6 6"/>
<text x="600" y="278" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', sans-serif" font-size="20" fill="#1F7A4D" text-anchor="middle" xml:space="preserve">без сети и без моков: parse.py не импортирует клиент</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="600" height="720" viewBox="0 0 600 720" role="img" aria-labelledby="title desc">
<title id="title">Every adapter is three files, and only one does I/O</title>
<desc id="desc">client.py (or browser.py for Ozon) knows the endpoints and is the only file that does I/O; it hands a decoded dict to parse.py, pure functions with no imports from the client, which return Raw models; source.py wires both into a ProductSource for your code. The parsers are tested against saved payloads with no network and no mocking.</desc>
<rect width="600" height="720" rx="20" fill="#F2F5F7"/>
<text x="32" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', sans-serif" font-size="30" fill="#14202B" font-weight="700" xml:space="preserve">Every adapter is three files,</text>
<text x="32" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', sans-serif" font-size="30" fill="#14202B" font-weight="700" xml:space="preserve">and only one does I/O</text>
<rect x="32" y="128" width="500" height="120" rx="12" fill="#FFFFFF" stroke="#A8730B" stroke-width="2"/>
<text x="56" y="170" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="26" fill="#A8730B" font-weight="700" xml:space="preserve">client.py</text>
<text x="56" y="204" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', sans-serif" font-size="22" fill="#14202B" xml:space="preserve">endpoints, HTTP or browser</text>
<text x="56" y="232" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', sans-serif" font-size="21" fill="#56636E" xml:space="preserve">the only file with I/O</text>
<rect x="32" y="312" width="500" height="120" rx="12" fill="#FFFFFF" stroke="#D5DDE3" stroke-width="2"/>
<text x="56" y="354" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="26" fill="#0A6A94" font-weight="700" xml:space="preserve">parse.py</text>
<text x="56" y="388" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', sans-serif" font-size="22" fill="#14202B" xml:space="preserve">pure functions over dicts</text>
<text x="56" y="416" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', sans-serif" font-size="21" fill="#56636E" xml:space="preserve">tested on saved payloads</text>
<rect x="32" y="496" width="500" height="120" rx="12" fill="#FFFFFF" stroke="#D5DDE3" stroke-width="2"/>
<text x="56" y="538" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="26" fill="#0A6A94" font-weight="700" xml:space="preserve">source.py</text>
<text x="56" y="572" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', sans-serif" font-size="22" fill="#14202B" xml:space="preserve">wires both together</text>
<text x="56" y="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', sans-serif" font-size="21" fill="#56636E" xml:space="preserve">implements ProductSource</text>
<path d="M282 258 V302 M274 292 L282 302 L290 292" stroke="#56636E" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="302" y="287" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="21" fill="#56636E" xml:space="preserve">dict</text>
<path d="M282 442 V486 M274 476 L282 486 L290 476" stroke="#56636E" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="302" y="471" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="21" fill="#56636E" xml:space="preserve">Raw*</text>
<path d="M540 372 H562 V634 H470" stroke="#1F7A4D" stroke-width="2" fill="none" stroke-dasharray="6 6"/>
<text x="300" y="662" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', sans-serif" font-size="22" fill="#1F7A4D" text-anchor="middle" xml:space="preserve">no network, no mocking:</text>
<text x="300" y="692" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', sans-serif" font-size="22" fill="#1F7A4D" text-anchor="middle" xml:space="preserve">parse.py never imports the client</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="600" height="720" viewBox="0 0 600 720" role="img" aria-labelledby="title desc">
<title id="title">Каждый адаптер — три файла, и I/O только в одном</title>
<desc id="desc">client.py (у Ozon browser.py) знает эндпоинты и единственный делает I/O; он передаёт декодированный dict в parse.py — чистые функции без импорта клиента, которые возвращают Raw-модели; source.py связывает их в ProductSource для вашего кода. Парсеры тестируются на сохранённых ответах без сети и без моков.</desc>
<rect width="600" height="720" rx="20" fill="#0E161E"/>
<text x="32" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', sans-serif" font-size="30" fill="#E5ECF1" font-weight="700" xml:space="preserve">Каждый адаптер — три файла,</text>
<text x="32" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', sans-serif" font-size="30" fill="#E5ECF1" font-weight="700" xml:space="preserve">и I/O только в одном</text>
<rect x="32" y="128" width="500" height="120" rx="12" fill="#16212C" stroke="#E2B04A" stroke-width="2"/>
<text x="56" y="170" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="26" fill="#E2B04A" font-weight="700" xml:space="preserve">client.py</text>
<text x="56" y="204" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', sans-serif" font-size="22" fill="#E5ECF1" xml:space="preserve">эндпоинты, HTTP/браузер</text>
<text x="56" y="232" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', sans-serif" font-size="21" fill="#97A5B1" xml:space="preserve">единственный с I/O</text>
<rect x="32" y="312" width="500" height="120" rx="12" fill="#16212C" stroke="#2A3845" stroke-width="2"/>
<text x="56" y="354" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="26" fill="#5DB7DF" font-weight="700" xml:space="preserve">parse.py</text>
<text x="56" y="388" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', sans-serif" font-size="22" fill="#E5ECF1" xml:space="preserve">чистые функции над dict</text>
<text x="56" y="416" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', sans-serif" font-size="21" fill="#97A5B1" xml:space="preserve">тесты на сохранённых ответах</text>
<rect x="32" y="496" width="500" height="120" rx="12" fill="#16212C" stroke="#2A3845" stroke-width="2"/>
<text x="56" y="538" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="26" fill="#5DB7DF" font-weight="700" xml:space="preserve">source.py</text>
<text x="56" y="572" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', sans-serif" font-size="22" fill="#E5ECF1" xml:space="preserve">связывает оба файла</text>
<text x="56" y="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', sans-serif" font-size="21" fill="#97A5B1" xml:space="preserve">реализует ProductSource</text>
<path d="M282 258 V302 M274 292 L282 302 L290 292" stroke="#97A5B1" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="302" y="287" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="20" fill="#97A5B1" xml:space="preserve">dict</text>
<path d="M282 442 V486 M274 476 L282 486 L290 476" stroke="#97A5B1" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="302" y="471" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="20" fill="#97A5B1" xml:space="preserve">Raw*</text>
<path d="M540 372 H562 V634 H470" stroke="#6FCF9A" stroke-width="2" fill="none" stroke-dasharray="6 6"/>
<text x="300" y="662" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', sans-serif" font-size="22" fill="#6FCF9A" text-anchor="middle" xml:space="preserve">без сети и без моков:</text>
<text x="300" y="692" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', sans-serif" font-size="22" fill="#6FCF9A" text-anchor="middle" xml:space="preserve">parse.py не импортирует клиент</text>
</svg>

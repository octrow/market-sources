[project]
name = "market-sources"
version = "0.1.0"
description = "Marketplace product sources (Kaspi.kz / OLX.kz / Ozon.kz) on a common ProductSource protocol, plus the polite-HTTP and persistent-browser layers under them"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2",
]

[project.optional-dependencies]
# Only the Ozon adapter (and `playwright_session`'s launch path) needs a browser.
# Both modules import fine without it — playwright is imported lazily.
browser = ["playwright>=1.44"]
# OLX's WAF blocks httpx's TLS fingerprint; curl_cffi impersonates Chrome (impersonate.py).
impersonate = ["curl_cffi>=0.11"]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/market_sources"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
